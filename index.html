<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.8.1/firebase-auth.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTCnITmxkisXJ4-HFQG08OjtgwQGfsmDQ",
    authDomain: "orvalho-propostas.firebaseapp.com",
    projectId: "orvalho-propostas",
    storageBucket: "orvalho-propostas.firebasestorage.app",
    messagingSenderId: "620991351828",
    appId: "1:620991351828:web:7c20ce8242cb84e75dab01"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);

  window._FB = {
    db, auth,
    signIn: (email, pass) => signInWithEmailAndPassword(auth, email, pass),
    signOut: () => signOut(auth),
    onAuth: (cb) => onAuthStateChanged(auth, cb),
    save: async (colName, docId, data) => {
      await setDoc(doc(db, 'orvalho', colName, 'docs', docId), {_d: JSON.stringify(data), _t: Date.now()});
    },
    load: async (colName, docId) => {
      const snap = await getDoc(doc(db, 'orvalho', colName, 'docs', docId));
      if (!snap.exists()) return null;
      const raw = snap.data();
      return raw._d ? JSON.parse(raw._d) : raw;
    },
    loadAll: async (colName) => {
      const snap = await getDocs(collection(db, 'orvalho', colName, 'docs'));
      return snap.docs.map(d => { const r=d.data(); return r._d ? JSON.parse(r._d) : r; });
    },
  };
</script>

};

  load:async(col,id,def)=>{
    if(window._FB){

// ─── GERADOR DE NÚMERO ───────────────────────────────────────────
function genProposalNumber(proposals, dateStr) {
  const d = dateStr ? new Date(dateStr+'T12:00:00') : new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yy = String(d.getFullYear()).slice(2);
  const prefix = `ORV-${dd}${mm}${yy}`;
  const same = proposals.filter(p => p.number && p.number.startsWith(prefix));
  return `${prefix}-${String(same.length+1).padStart(2,'0')}`;
}

    function b64toUint8(b64) {
      const bin = atob(b64);
      const arr = new Uint8Array(bin.length);

    }

    const logoData  = b64toUint8(LOGO_B64);
    const iconeData = b64toUint8(ICONE_B64);

    // ── PALETA ──────────────────────────────────────────────
    const VD='285D02', WH='FFFFFF', GR='1A1A1A', MGR='888888', VL='9ABF4A';
    const NB = {style:BorderStyle.NONE,size:0,color:'FFFFFF'};
    const NBS = {top:NB,bottom:NB,left:NB,right:NB,insideH:NB,insideV:NB};

    const prop_name = prop.proposalName || (prop.selectedServices||[]).map(id=>prop.serviceTitles?.[id]||services.find(s=>s.id===id)?.name||id).join(' + ');
    const total = prop.discount>0 ? (prop.budget?.totalComDesconto||prop.budget?.total||0) : (prop.budget?.total||0);
    const totalOriginal = prop.budget?.total||0;
    const validity = prop.validity||20;
    const empresa = configs?.empresa||{};

    // ── HELPERS ─────────────────────────────────────────────
    const sp = (before=0,after=0) => ({before,after});
    const tr = (text,sz=20,col=GR,bold=false,italic=false) =>
      new TextRun({text,size:sz,color:col,bold,italic,font:'Calibri'});
    const par = (children, align=AlignmentType.LEFT, spacing=sp(0,80), keepNext=false) =>
      new Paragraph({children,alignment:align,spacing,keepNext});
    const parEmpty = (before=0,after=0) =>
      new Paragraph({children:[],spacing:sp(before,after)});

    const shdCell = (fill) => ({fill,type:ShadingType.CLEAR});

    const cell = (children, fill, width, align=AlignmentType.LEFT, margins={top:90,bottom:90,left:100,right:100}) =>
      new TableCell({
        children:[new Paragraph({children,alignment:align,spacing:sp(0,0)})],
        shading:shdCell(fill),
        borders:NBS,
        width:{size:width,type:WidthType.DXA},
        margins,
      });

    const greenBar = (text) => new Table({
      width:{size:9360,type:WidthType.DXA},
      columnWidths:[9360],
      rows:[new TableRow({children:[
        new TableCell({
          children:[new Paragraph({
            children:[tr(text,22,WH,true)],
            spacing:sp(80,80),
            indent:{left:140},
          })],
          shading:shdCell(VD),
          borders:NBS,
        })]})]
    });

    const grayDivider = () => new Paragraph({
      children:[],
      spacing:sp(80,80),
      border:{bottom:{style:BorderStyle.SINGLE,size:4,color:'CCCCCC'}},
    });

    const greenDivider = () => new Paragraph({
      children:[],
      spacing:sp(40,0),
      border:{bottom:{style:BorderStyle.SINGLE,size:6,color:VD}},
    });

    const parseBlock = (text) => {
      const paras = [];
      (text||'').split('\n').forEach(line => {
        line = line.trim();
        if (!line) return;
        if (line.startsWith('•')) {
          paras.push(new Paragraph({
            children:[tr('•  ',20,MGR), tr(line.slice(1).trim(),20,GR)],
            spacing:sp(20,20),
            indent:{left:280,hanging:160},
          }));
        } else {
          paras.push(par([tr(line,20,GR)], AlignmentType.JUSTIFIED, sp(20,20)));
        }
      });
      return paras;
    };

    const subTitle = (text) => new Paragraph({
      children:[tr(text,21,GR,true)],
      spacing:sp(120,30),
    });

    // ── LOGO IMAGE ───────────────────────────────────────────
    const logoImg = new ImageRun({
      data: logoData,
      transformation:{width:340,height:144},
      type:'jpg',
    });
    const iconeImg = (w=54,h=72) => new ImageRun({
      data: iconeData,
      transformation:{width:w,height:h},
      type:'jpg',
    });

    // ════════════════════════════════════════════════════════
    // SEÇÃO 1 — Página 1 com mini-capa integrada (sem header)
    // ════════════════════════════════════════════════════════
    const sec1Children = [];

    // Logo centralizada
    sec1Children.push(new Paragraph({
      children:[logoImg],
      alignment:AlignmentType.CENTER,
      spacing:sp(0,0),
    }));

    // Linha verde fina
    sec1Children.push(greenDivider());
    sec1Children.push(parEmpty(0,140));

    // Label "PROPOSTA COMERCIAL"
    sec1Children.push(par(
      [tr('PROPOSTA COMERCIAL',20,MGR,true)],
      AlignmentType.CENTER, sp(0,0)
    ));

    // Nome da proposta — grande
    sec1Children.push(new Paragraph({
      children:[tr(prop_name,34,GR,true)],
      alignment:AlignmentType.CENTER,
      spacing:sp(50,0),
    }));

    // Linha verde separadora
    sec1Children.push(new Paragraph({
      children:[],
      spacing:sp(120,120),
      border:{bottom:{style:BorderStyle.SINGLE,size:6,color:VD}},
    }));

    // Tabela de dados do cliente
    const clienteRows = [
      ['Requerente', prop.client||'—', true],
      ['Proposta nº', prop.number||'—', false],
      ['Data', fmtDate(prop.date), false],
      ['Validade', `${validity} dias`, false],
    ];
    sec1Children.push(new Table({
      width:{size:9360,type:WidthType.DXA},
      columnWidths:[1800,7560],
      rows: clienteRows.map(([label,val,bold]) => new TableRow({children:[
        new TableCell({children:[par([tr(label,17,MGR)],AlignmentType.LEFT,sp(30,30))],borders:NBS,width:{size:1800,type:WidthType.DXA},margins:{top:30,bottom:30,left:0,right:0}}),
        new TableCell({children:[par([tr(val,19,GR,bold)],AlignmentType.LEFT,sp(30,30))],borders:NBS,width:{size:7560,type:WidthType.DXA},margins:{top:30,bottom:30,left:0,right:0}}),
      ]}))
    }));

    sec1Children.push(parEmpty(0,60));

    // Linha verde fecha intro
    sec1Children.push(new Paragraph({
      children:[],
      spacing:sp(0,60),
      border:{bottom:{style:BorderStyle.SINGLE,size:6,color:VD}},
    }));

    sec1Children.push(parEmpty(0,60));

    // ── CONTEÚDO PÁG 1 ──────────────────────────────────────
    // 1. OBJETIVO
    if(prop.objective) {
      sec1Children.push(greenBar('1. OBJETIVO'));
      sec1Children.push(parEmpty(0,40));
      sec1Children.push(...parseBlock(prop.objective));
      sec1Children.push(grayDivider());
    }

    // 2. ESCOPO DOS SERVIÇOS
    sec1Children.push(greenBar('2. ESCOPO DOS SERVIÇOS'));
    sec1Children.push(parEmpty(0,40));
    const svcList = prop.selectedServices||[];
    svcList.forEach((sid,i) => {
      const title = prop.serviceTitles?.[sid]||services.find(s=>s.id===sid)?.name||sid;
      const scope = prop.serviceScopes?.[sid]||'';
      sec1Children.push(subTitle(`2.${i+1}  ${title}`));
      sec1Children.push(...parseBlock(scope));
    });
    if(prop.hasOtherService && prop.otherServiceTitle) {
      sec1Children.push(subTitle(`2.${svcList.length+1}  ${prop.otherServiceTitle}`));
      sec1Children.push(...parseBlock(prop.otherServiceScope||''));
    }
    if(prop.duracaoCampo) {
      sec1Children.push(par([tr('Duração das atividades em campo: ',20,GR,true), tr(prop.duracaoCampo,20,GR)], AlignmentType.LEFT, sp(60,60)));
    }
    sec1Children.push(grayDivider());

    // 3. NÃO INCLUSO
    sec1Children.push(greenBar('3. NÃO INCLUSO NO ESCOPO'));
    sec1Children.push(parEmpty(0,40));
    sec1Children.push(...parseBlock(prop.notIncluded||''));
    sec1Children.push(grayDivider());

    // 4. RESPONSABILIDADES
    sec1Children.push(greenBar('4. RESPONSABILIDADES CONTRATUAIS'));
    sec1Children.push(parEmpty(0,40));
    sec1Children.push(subTitle('4.1  Contratada — Orvalho Consultoria Ambiental'));
    sec1Children.push(...parseBlock(prop.respContratada||''));
    sec1Children.push(subTitle('4.2  Contratante'));
    sec1Children.push(...parseBlock(prop.respContratante||''));
    sec1Children.push(grayDivider());

    // 5. PRAZOS
    sec1Children.push(greenBar('5. PRAZOS'));
    sec1Children.push(parEmpty(0,40));
    if(prop.prazoVisita) {
      const opt = PRAZO_VISITA_OPTS.find(o=>o.value===prop.prazoVisita);
      sec1Children.push(par([tr('Mobilização para campo: ',20,GR,true), tr(opt?.label||prop.prazoVisita,20,MGR)], AlignmentType.LEFT, sp(25,25)));
    }
    if(prop.prazoEntrega)
      sec1Children.push(par([tr('Prazo de entrega do documento: ',20,GR,true), tr(`${prop.prazoEntrega} dias úteis após finalização das atividades em campo`,20,MGR)], AlignmentType.LEFT, sp(25,25)));
    if(prop.duracaoCampo)
      sec1Children.push(par([tr('Duração das atividades em campo: ',20,GR,true), tr(prop.duracaoCampo,20,MGR)], AlignmentType.LEFT, sp(25,25)));
    sec1Children.push(par([tr('Validade da proposta: ',20,GR,true), tr(`${validity} dias a contar da data de emissão`,20,MGR)], AlignmentType.LEFT, sp(25,25)));
    sec1Children.push(grayDivider());

    // 6. INVESTIMENTO
    sec1Children.push(greenBar('6. INVESTIMENTO'));
    sec1Children.push(parEmpty(0,40));
    sec1Children.push(new Table({
      width:{size:9360,type:WidthType.DXA},
      columnWidths:[680,7080,1600],
      rows:[
        new TableRow({tableHeader:true,children:[
          cell([tr('ITEM',20,WH,true)], VD, 680, AlignmentType.CENTER),
          cell([tr('SERVIÇO / DESCRIÇÃO',20,WH,true)], VD, 7080, AlignmentType.LEFT),
          cell([tr('VALOR',20,WH,true)], VD, 1600, AlignmentType.CENTER),
        ]}),
        new TableRow({children:[
          cell([tr('I',20,GR)], 'F5F5F5', 680, AlignmentType.CENTER),
          cell([tr(prop_name,20,GR)], 'F5F5F5', 7080, AlignmentType.LEFT),
          cell([tr(fmtBRL(totalOriginal),20,VD,true)], 'F5F5F5', 1600, AlignmentType.CENTER),
        ]}),
        new TableRow({children:[
          cell([tr('',20,GR)], 'EBEBEB', 680, AlignmentType.CENTER),
          cell([tr('TOTAL',20,GR,true)], 'EBEBEB', 7080, AlignmentType.RIGHT),
          cell([tr(fmtBRL(total),22,VD,true)], 'EBEBEB', 1600, AlignmentType.CENTER),
        ]}),
      ]
    }));
    if(prop.discount>0)
      sec1Children.push(par([tr(`Desconto de ${prop.discount}% aplicado — valor final: `,18,MGR,false,true), tr(fmtBRL(total),18,VD,true)], AlignmentType.LEFT, sp(60,20)));
    sec1Children.push(par([tr('* ',18,MGR), tr(prop.paymentText||'',18,MGR,false,true)], AlignmentType.JUSTIFIED, sp(80,20)));
    sec1Children.push(grayDivider());

    // 7. CONDIÇÕES DE PAGAMENTO
    if((prop.parcels||[]).length>0) {
      sec1Children.push(greenBar('7. CONDIÇÕES DE PAGAMENTO'));
      sec1Children.push(parEmpty(0,40));
      const pagRows = [
        new TableRow({tableHeader:true,children:[
          cell([tr('PARCELA',20,WH,true)],VD,1800,AlignmentType.CENTER),
          cell([tr('CONDIÇÃO DE PAGAMENTO',20,WH,true)],VD,5760,AlignmentType.LEFT),
          cell([tr('VALOR',20,WH,true)],VD,1800,AlignmentType.CENTER),
        ]}),
        ...prop.parcels.map((p,i) => new TableRow({children:[
          cell([tr(p.label||`${i+1}ª Parcela`,20,GR)], i%2?'FFFFFF':'F5F5F5', 1800, AlignmentType.CENTER),
          cell([tr(p.quando||'',20,GR)], i%2?'FFFFFF':'F5F5F5', 5760, AlignmentType.LEFT),
          cell([tr(fmtBRL(+(p.value||0)),20,VD,true)], i%2?'FFFFFF':'F5F5F5', 1800, AlignmentType.CENTER),
        ]})),
        new TableRow({children:[
          cell([tr('',20,GR)],'EBEBEB',1800,AlignmentType.CENTER),
          cell([tr('TOTAL',20,GR,true)],'EBEBEB',5760,AlignmentType.RIGHT),
          cell([tr(fmtBRL(total),22,VD,true)],'EBEBEB',1800,AlignmentType.CENTER),
        ]}),
      ];
      sec1Children.push(new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[1800,5760,1800],rows:pagRows}));
      const methods=(prop.paymentMethods||[]).map(m=>({pix:'Pix',boleto:'Boleto Bancário',deposito:'Depósito Bancário',transferencia:'Transferência Bancária'})[m]||m);
      sec1Children.push(par([tr('Formas de pagamento: ',20,GR,true), tr(methods.join(', ')+'.',20,MGR)], AlignmentType.LEFT, sp(100,25)));
      const dadosBanco = empresa.banco ? [
        ['Banco:', empresa.banco||''],
        [`Agência: ${empresa.agencia||''}  |  Conta:`, empresa.conta||''],
        ['Pix (CNPJ):', empresa.pix||''],
      ] : [];
      if(dadosBanco.length) {
        sec1Children.push(par([tr('Dados bancários:',20,GR,true)], AlignmentType.LEFT, sp(80,10)));
        const bRows = dadosBanco.map(([ l,v],i) => new TableRow({children:[
          cell([tr(l,19,GR,true)], i%2?'FFFFFF':'F5F5F5', 2600, AlignmentType.LEFT, {top:40,bottom:40,left:80,right:80}),
          cell([tr(v,19,MGR)], i%2?'FFFFFF':'F5F5F5', 6760, AlignmentType.LEFT, {top:40,bottom:40,left:80,right:80}),
        ]}));
        sec1Children.push(new Table({width:{size:9360,type:WidthType.DXA},columnWidths:[2600,6760],rows:bRows}));
      }
      sec1Children.push(grayDivider());
    }

    // ── ASSINATURA — sem page break forçado, keep_next agrupa elementos ──
    sec1Children.push(parEmpty(160,0));
    sec1Children.push(new Paragraph({children:[tr(`Joinville/SC, ${fmtDate(prop.date)}.`,21,GR)],alignment:AlignmentType.CENTER,spacing:sp(0,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[],spacing:sp(560,0),keepNext:true})); // espaço assinar
    sec1Children.push(new Paragraph({children:[tr('_'.repeat(52),20,MGR)],alignment:AlignmentType.CENTER,spacing:sp(0,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[tr(empresa.responsavel||'Bianca da Cruz Iéck',24,VD,true)],alignment:AlignmentType.CENTER,spacing:sp(80,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[tr(empresa.cargo||'Bióloga Responsável',20,MGR)],alignment:AlignmentType.CENTER,spacing:sp(15,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[tr(empresa.crbio||'CRBio 132683/01-D',20,MGR)],alignment:AlignmentType.CENTER,spacing:sp(15,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[iconeImg(54,72)],alignment:AlignmentType.CENTER,spacing:sp(240,0),keepNext:true}));
    sec1Children.push(new Paragraph({children:[tr(empresa.site||'www.orvalhoambiental.com.br',18,VL,false,true)],alignment:AlignmentType.CENTER,spacing:sp(20,0)}));

    // ════════════════════════════════════════════════════════
    // CABEÇALHO DAS PÁGINAS INTERNAS (seção 2)
    // ════════════════════════════════════════════════════════
    const runningHeader = new Header({
      children:[
        new Table({
          width:{size:9360,type:WidthType.DXA},
          columnWidths:[900,6660,1800]  ,
          rows:[new TableRow({children:[
            // ícone
            new TableCell({children:[new Paragraph({children:[iconeImg(48,64)],spacing:sp(0,0)})],borders:NBS,width:{size:900,type:WidthType.DXA},margins:{top:10,bottom:10,left:0,right:60}}),
            // nome + nº
            new TableCell({
              children:[
                new Paragraph({children:[tr('Orvalho Consultoria Ambiental',18,GR,true)],spacing:sp(0,0)}),
                new Paragraph({children:[tr(`Proposta nº ${prop.number||''}`,16,MGR)],spacing:sp(0,0)}),
              ],
              borders:NBS,width:{size:6660,type:WidthType.DXA},
              margins:{top:10,bottom:10,left:0,right:0},
              verticalAlign:'bottom',
            }),
            // data
            new TableCell({
              children:[new Paragraph({children:[tr(fmtDate(prop.date),16,MGR)],alignment:AlignmentType.RIGHT,spacing:sp(0,0)})],
              borders:NBS,width:{size:1800,type:WidthType.DXA},
              margins:{top:10,bottom:10,left:0,right:0},
              verticalAlign:'bottom',
            }),
          ]})]
        }),
        new Paragraph({
          children:[],spacing:sp(40,0),
          border:{bottom:{style:BorderStyle.SINGLE,size:6,color:VD}},
        }),
      ]
    });

    // ════════════════════════════════════════════════════════
    // DOCUMENTO FINAL
    // ════════════════════════════════════════════════════════
    const document = new Document({
      sections:[
        {
          // Seção 1 — pág 1 sem header automático
          properties:{
            page:{
              margin:{top:convertInchesToTwip(0.79),right:convertInchesToTwip(0.98),bottom:convertInchesToTwip(0.79),left:convertInchesToTwip(0.98)},
            },
            titlePage:true,
          },
          headers:{
            default: new Header({children:[new Paragraph({children:[]})]}),
            first: new Header({children:[new Paragraph({children:[]})]}),
          },
          children: sec1Children,
        },
      ]
    });

    const blob = await Packer.toBlob(document);
    saveAs(blob, `Proposta_${prop.number||'Orvalho'}.docx`);

  } catch(e) {
    alert('Erro ao gerar Word: '+e.message);
    console.error(e);
  }
}

// ─── APP ────────────────────────────────────────────────────────
function App(){
  const[authed,setAuthed]=useState(()=>LS.get('orv_local_authed',false));
  const[fbUser,setFbUser]=useState(null);
  const[loading,setLoading]=useState(false);
  const[page,setPage]=useState('propostas');
  const[proposals,setProposals]=useState([]);
  const[services,setServices]=useState(()=>LS.get('orv_services2',DEFAULT_SERVICES));
  const[cnaes,setCnaes]=useState(()=>LS.get('orv_cnaes2',DEFAULT_CNAE));
  const[fixedCosts,setFixedCosts]=useState(()=>LS.get('orv_fixedcosts2',DEFAULT_FIXED_COSTS));
  const[configs,setConfigs]=useState(()=>LS.get('orv_configs2',{
    notIncluded:DEFAULT_NOT_INCLUDED,respContratada:DEFAULT_RESP_CONTRATADA,
    respContratante:DEFAULT_RESP_CONTRATANTE,costText:DEFAULT_COST_TEXT,validity:20,
    empresa:{name:'Orvalho Consultoria Ambiental',cnpj:'',endereco:'Joinville/SC',contato:'+55 47 99245-4106',responsavel:'Bianca da Cruz Iéck'}
  }));
  const[sidebarOpen,setSidebarOpen]=useState(false);
  const[syncStatus,setSyncStatus]=useState('');

  useEffect(()=>{
    // Login do app agora é local (não depende do Firebase Authentication).
    // Se por acaso já existir uma sessão do Firebase ativa, aproveita pra
    // sincronizar na nuvem, mas isso nunca bloqueia nem controla o acesso.
    const init=()=>{
      if(window._FB){
        window._FB.onAuth(user=>{
          setFbUser(user);
          if(user) loadFromFirebase();
        });
      } else { setTimeout(init,300); }
    };
    init();
  },[]);

  const loadFromFirebase=async()=>{
    // Firebase é SEMPRE a fonte de verdade
    setSyncStatus('Sincronizando...');
    try{
      // Propostas: cada uma é um doc separado
      const ps=await FB.loadAll('proposals',[]);
      if(ps&&ps.length>0){
        const sorted=ps.sort((a,b)=>new Date(b.date||0)-new Date(a.date||0));
        setProposals(sorted);
        LS.set('orv_proposals2',sorted);
      }
      // Configurações
      const sv=await FB.load('config','services',null);
      if(sv){const v=Array.isArray(sv)?sv:DEFAULT_SERVICES;setServices(v);LS.set('orv_services2',v);}
      const cn=await FB.load('config','cnaes',null);
      if(cn){const v=Array.isArray(cn)?cn:DEFAULT_CNAE;setCnaes(v);LS.set('orv_cnaes2',v);}
      const cf=await FB.load('config','fixedcosts',null);
      if(cf){const v=Array.isArray(cf)?cf:DEFAULT_FIXED_COSTS;setFixedCosts(v);LS.set('orv_fixedcosts2',v);}
      const cfg=await FB.load('config','configs',null);
      if(cfg){setConfigs(cfg);LS.set('orv_configs2',cfg);}
      setSyncStatus('✓ Salvo na nuvem');
      setTimeout(()=>setSyncStatus(''),3000);
    }catch(e){
      console.error('Firebase erro:',e);
      setSyncStatus('⚠️ Modo offline — carregando dados locais');
      // Só usa localStorage como fallback se Firebase falhar
      setProposals(LS.get('orv_proposals2',[]));
    }
  };

  useEffect(()=>{
    LS.set('orv_proposals2',proposals);
    if(!fbUser||proposals.length===0) return;
    proposals.forEach(p=>{ FB.save('proposals',String(p.id),p).catch(()=>{}); });
  },[proposals]);

  useEffect(()=>{ LS.set('orv_services2',services); if(fbUser) FB.save('config','services',services).catch(()=>{}); },[services]);
  useEffect(()=>{ LS.set('orv_cnaes2',cnaes); if(fbUser) FB.save('config','cnaes',cnaes).catch(()=>{}); },[cnaes]);
  useEffect(()=>{ LS.set('orv_fixedcosts2',fixedCosts); if(fbUser) FB.save('config','fixedcosts',fixedCosts).catch(()=>{}); },[fixedCosts]);
  useEffect(()=>{ LS.set('orv_configs2',configs); if(fbUser) FB.save('config','configs',configs).catch(()=>{}); },[configs]);

  if(loading) return(
    <div style={{minHeight:'100vh',display:'flex',alignItems:'center',justifyContent:'center',background:'linear-gradient(135deg,#285d02,#133b65)',flexDirection:'column',gap:14}}>
      <div style={{fontSize:48}}>🌿</div>
      <div style={{color:'#fff',fontSize:20,fontFamily:'Playfair Display,serif',fontWeight:700}}>Orvalho</div>
      <div style={{color:'rgba(255,255,255,.6)',fontSize:13}}>Conectando ao servidor...</div>
    </div>
  );

  if(!authed) return <Login onLogin={()=>{ LS.set('orv_local_authed',true); setAuthed(true); }}/>;

  const nav=[
    {id:'dashboard',icon:'📊',label:'Dashboard'},
    {id:'propostas',icon:'📋',label:'Gestão de Propostas'},
    {id:'nova',icon:'✨',label:'Nova Proposta'},
    {id:'configuracoes',icon:'⚙️',label:'Configurações'},
  ];

  const handleSignOut=async()=>{
    if(window._FB) { try{ await window._FB.signOut(); }catch{} }
    LS.set('orv_local_authed',false);
    setAuthed(false);setFbUser(null);
  };

  return(
    <div className="app">
      <button className="hamburger" onClick={()=>setSidebarOpen(o=>!o)}>☰</button>
      {sidebarOpen&&<div className="sidebar-backdrop" onClick={()=>setSidebarOpen(false)}/>}
      <aside className={`sidebar${sidebarOpen?' open':''}`}>
        <div className="sidebar-logo">
          <div className="brand">Orvalho</div>
          <div className="name">Propostas Comerciais</div>
          <div className="tagline">Consultoria Ambiental</div>
        </div>
        <nav className="sidebar-nav">
          {nav.map(n=>(
            <button key={n.id} className={`nav-item${page===n.id?' active':''}`}
              onClick={()=>{setPage(n.id);setSidebarOpen(false);}}>
              <span className="icon">{n.icon}</span>{n.label}
            </button>
          ))}
        </nav>
        <div className="sidebar-footer">
          {syncStatus&&<div style={{fontSize:11,color:'rgba(255,255,255,.7)',marginBottom:5,textAlign:'center'}}>{syncStatus}</div>}
          <div className="user"><strong>Bianca Iéck</strong>{fbUser?.email||LOCAL_AUTH.email}</div>
          <button className="btn btn-secondary btn-sm" style={{marginTop:8,width:'100%'}} onClick={handleSignOut}>Sair</button>
        </div>
      </aside>
      <main className="main">
        {page==='dashboard'&&<DashboardPage proposals={proposals} services={services}/>}
        {page==='propostas'&&<PropostasPage proposals={proposals} setProposals={setProposals} services={services} cnaes={cnaes} configs={configs} setPage={setPage}/>}
        {page==='nova'&&<NovaPropostaPage proposals={proposals} setProposals={setProposals} services={services} cnaes={cnaes} configs={configs} fixedCosts={fixedCosts} onBack={()=>setPage('propostas')}/>}
        {page==='configuracoes'&&<ConfigPage services={services} setServices={setServices} cnaes={cnaes} setCnaes={setCnaes} configs={configs} setConfigs={setConfigs} fixedCosts={fixedCosts} setFixedCosts={setFixedCosts}/>}
      </main>
    </div>
  );
}
// ─── LOGIN ───────────────────────────────────────────────────────
function Login({onLogin}){
  const[email,setEmail]=useState(LOCAL_AUTH.email);
  const[pass,setPass]=useState('');
  const[err,setErr]=useState('');
  const[loading,setLoading]=useState(false);
  const go=async()=>{
    if(!email||!pass){setErr('Preencha e-mail e senha.');return;}
    setLoading(true);setErr('');
    // Login local — não depende do Firebase Authentication.
    const ok=email.trim().toLowerCase()===LOCAL_AUTH.email.toLowerCase() && pass===LOCAL_AUTH.pass;
    if(ok){
      onLogin();
    } else {
      setErr('E-mail ou senha incorretos.');
    }
    setLoading(false);
  };
  return(
    <div className="login-wrap">
      <div className="login-card">
        <div className="login-logo">
          <span className="orv-icon">🌿</span>
          <h1>Orvalho</h1>
          <p>Sistema de Propostas Comerciais</p>
        </div>
        {err&&<div className="alert alert-warning">{err}</div>}
        <div className="form-group"><label className="form-label">E-mail</label><input className="form-control" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="seu@email.com" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <div className="form-group"><label className="form-label">Senha</label><input className="form-control" type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="••••••••" onKeyDown={e=>e.key==='Enter'&&go()}/></div>
        <button className="btn btn-primary" style={{width:'100%',justifyContent:'center',padding:'11px'}} onClick={go} disabled={loading}>{loading?'Entrando...':'Entrar'}</button>
        <div style={{marginTop:14,fontSize:12,color:'var(--txl)',textAlign:'center'}}>Acesso restrito ao Orvalho.</div>
      </div>
    </div>
  );
}

// ─── DASHBOARD ───────────────────────────────────────────────────
function DashboardPage({proposals,services}){
  const statusMap={elaborando:'Elaborando',enviada:'Enviada',aprovada:'Aprovada',reprovada:'Reprovada',semresposta:'Sem Resposta',cancelada:'Cancelada'};
  const byStatus=Object.entries(statusMap).map(([k,l])=>({label:l,count:proposals.filter(p=>p.status===k).length,key:k}));
  const aprovadas=proposals.filter(p=>p.status==='aprovada');
  const fat=aprovadas.reduce((s,p)=>s+(p.budget?.total||0),0);
  const fatMeses={};
  proposals.filter(p=>p.status==='aprovada').forEach(p=>{
    if(!p.date) return;
    const [y,m]=p.date.split('-');
    const k=`${m}/${y}`;
    fatMeses[k]=(fatMeses[k]||0)+(p.budget?.total||0);
  });
  const mesesKeys=Object.keys(fatMeses).sort((a,b)=>{const[ma,ya]=a.split('/');const[mb,yb]=b.split('/');return new Date(`${ya}-${ma}-01`)-new Date(`${yb}-${mb}-01`);});
  const maxFat=Math.max(...Object.values(fatMeses),1);
  // top serviços
  const svcCount={};
  proposals.forEach(p=>(p.selectedServices||[]).forEach(sid=>{svcCount[sid]=(svcCount[sid]||0)+1;}));
  const topSvcs=Object.entries(svcCount).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const maxSvc=Math.max(...topSvcs.map(([,c])=>c),1);
  // taxa fechamento
  const enviadas=proposals.filter(p=>['enviada','aprovada','reprovada'].includes(p.status));
  const txFech=enviadas.length>0?Math.round((aprovadas.length/enviadas.length)*100):0;

  return(
    <div>
      <div className="page-header"><h2>Dashboard</h2><p>Análise e acompanhamento das propostas comerciais</p></div>
      <div className="kpi-grid">
        <div className="kpi-card"><div className="kpi-icon">📋</div><div className="kpi-value">{proposals.length}</div><div className="kpi-label">Total de propostas</div></div>
        <div className="kpi-card blue"><div className="kpi-icon">✅</div><div className="kpi-value">{aprovadas.length}</div><div className="kpi-label">Aprovadas</div></div>
        <div className="kpi-card yellow"><div className="kpi-icon">💰</div><div className="kpi-value">{fmtBRL(fat)}</div><div className="kpi-label">Faturamento aprovado</div></div>
        <div className="kpi-card"><div className="kpi-icon">🎯</div><div className="kpi-value">{txFech}%</div><div className="kpi-label">Taxa de fechamento</div></div>
      </div>
      <div className="grid-2" style={{marginBottom:16}}>
        <div className="card">
          <div className="card-title">Por Status</div>
          {byStatus.map(s=>(
            <div key={s.key} style={{display:'flex',alignItems:'center',gap:10,marginBottom:10}}>
              <div style={{fontSize:13,flex:1,color:'var(--tx)'}}>{s.label}</div>
              <div style={{flex:2,background:'var(--bg)',borderRadius:6,height:14,overflow:'hidden'}}>
                <div style={{height:'100%',width:`${proposals.length?Math.round(s.count/proposals.length*100):0}%`,background:'var(--vl)',borderRadius:6,transition:'width .4s'}}/>
              </div>
              <div style={{fontSize:13,fontWeight:700,color:'var(--vd)',minWidth:24,textAlign:'right'}}>{s.count}</div>
            </div>
          ))}
        </div>
        <div className="card">
          <div className="card-title">Serviços mais orçados</div>
          {topSvcs.length===0?<div className="text-muted text-sm">Nenhuma proposta ainda.</div>:topSvcs.map(([sid,count])=>{
            const svc=services.find(s=>s.id===sid);
            return(
              <div key={sid} style={{marginBottom:10}}>
                <div style={{display:'flex',justifyContent:'space-between',marginBottom:3}}>
                  <span style={{fontSize:11.5,color:'var(--tx)'}}>{svc?.name||sid}</span>
                  <span style={{fontSize:12,fontWeight:700,color:'var(--vd)'}}>{count}</span>
                </div>
                <div style={{background:'var(--bg)',borderRadius:6,height:10,overflow:'hidden'}}>
                  <div style={{height:'100%',width:`${Math.round(count/maxSvc*100)}%`,background:'var(--az)',borderRadius:6}}/>
                </div>
              </div>
            );
          })}
        </div>
      </div>
      {mesesKeys.length>0&&(
        <div className="card">
          <div className="card-title">Faturamento aprovado por mês</div>
          <div className="dash-chart-bar">
            {mesesKeys.map(k=>(
              <div key={k} className="dash-bar-wrap">
                <div className="dash-bar-val">{fmtBRL(fatMeses[k]).replace('R$','').trim()}</div>
                <div className="dash-bar" style={{height:`${Math.round(fatMeses[k]/maxFat*100)}px`}}/>
                <div className="dash-bar-label">{k}</div>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

// ─── GESTÃO DE PROPOSTAS ────────────────────────────────────────
function PropostasPage({proposals,setProposals,services,cnaes,configs,setPage}){
  const[filter,setFilter]=useState({status:'',search:'',mes:'',ano:''});
  const[viewProp,setViewProp]=useState(null);

  const anosDisp=useMemo(()=>[...new Set(proposals.map(p=>p.date?.slice(0,4)).filter(Boolean))].sort().reverse(),[proposals]);
  const mesesDisp=['01','02','03','04','05','06','07','08','09','10','11','12'];
  const mesesNomes={
    '01':'Janeiro','02':'Fevereiro','03':'Março','04':'Abril','05':'Maio','06':'Junho',
    '07':'Julho','08':'Agosto','09':'Setembro','10':'Outubro','11':'Novembro','12':'Dezembro'
  };

  const filtered=proposals.filter(p=>{
    if(filter.status&&p.status!==filter.status) return false;
    if(filter.mes&&p.date?.slice(5,7)!==filter.mes) return false;
    if(filter.ano&&p.date?.slice(0,4)!==filter.ano) return false;
    if(filter.search){const q=filter.search.toLowerCase();if(!p.client?.toLowerCase().includes(q)&&!p.number?.toLowerCase().includes(q)) return false;}
    return true;
  });

  const statusMap={elaborando:{label:'Elaborando',cls:'badge-elaborando',emoji:'🟡'},enviada:{label:'Enviada',cls:'badge-enviada',emoji:'🔵'},aprovada:{label:'Aprovada',cls:'badge-aprovada',emoji:'🟢'},reprovada:{label:'Reprovada',cls:'badge-reprovada',emoji:'🔴'},semresposta:{label:'Sem resposta',cls:'badge-semresposta',emoji:'⚪'},cancelada:{label:'Cancelada',cls:'badge-cancelada',emoji:'⚫'}};
  const isReminder=p=>{if(p.status!=='enviada'||!p.sentAt)return false;return(new Date()-new Date(p.sentAt))/86400000>=7;};
  const del=id=>{if(confirm('Excluir proposta?'))setProposals(ps=>ps.filter(p=>p.id!==id));};
  const dup=prop=>{const np={...prop,id:Date.now(),number:genProposalNumber(proposals,today()),date:today(),status:'elaborando',sentAt:null,approvedAt:null};setProposals(ps=>[np,...ps]);};
  const changeStatus=(id,status)=>{setProposals(ps=>ps.map(p=>{if(p.id!==id)return p;const u={...p,status};if(status==='enviada'&&!p.sentAt)u.sentAt=today();if(status==='aprovada'&&!p.approvedAt)u.approvedAt=today();return u;}));};
  const kpis={total:filtered.length,enviadas:filtered.filter(p=>p.status==='enviada').length,aprovadas:filtered.filter(p=>p.status==='aprovada').length,faturamento:filtered.filter(p=>p.status==='aprovada').reduce((s,p)=>s+(p.budget?.total||0),0)};

  return(
    <div>
      <div className="page-header"><h2>Gestão de Propostas</h2><p>Acompanhe todas as propostas comerciais da Orvalho</p></div>
      <div className="kpi-grid">
        <div className="kpi-card"><div className="kpi-icon">📋</div><div className="kpi-value">{kpis.total}</div><div className="kpi-label">Exibindo</div></div>
        <div className="kpi-card blue"><div className="kpi-icon">📤</div><div className="kpi-value">{kpis.enviadas}</div><div className="kpi-label">Enviadas</div></div>
        <div className="kpi-card"><div className="kpi-icon">✅</div><div className="kpi-value">{kpis.aprovadas}</div><div className="kpi-label">Aprovadas</div></div>
        <div className="kpi-card yellow"><div className="kpi-icon">💰</div><div className="kpi-value">{fmtBRL(kpis.faturamento)}</div><div className="kpi-label">Faturamento</div></div>
      </div>
      <div className="card">
        <div style={{display:'flex',gap:8,flexWrap:'wrap',marginBottom:16,alignItems:'center'}}>
          <input className="form-control" style={{width:200}} placeholder="Buscar cliente ou nº..." value={filter.search} onChange={e=>setFilter(f=>({...f,search:e.target.value}))}/>
          <select className="form-control" style={{width:150}} value={filter.status} onChange={e=>setFilter(f=>({...f,status:e.target.value}))}>
            <option value="">Todos os status</option>
            {Object.entries(statusMap).map(([k,v])=><option key={k} value={k}>{v.emoji} {v.label}</option>)}
          </select>
          <select className="form-control" style={{width:130}} value={filter.mes} onChange={e=>setFilter(f=>({...f,mes:e.target.value}))}>
            <option value="">Todos os meses</option>
            {mesesDisp.map(m=><option key={m} value={m}>{mesesNomes[m]}</option>)}
          </select>
          <select className="form-control" style={{width:100}} value={filter.ano} onChange={e=>setFilter(f=>({...f,ano:e.target.value}))}>
            <option value="">Todos os anos</option>
            {anosDisp.map(a=><option key={a} value={a}>{a}</option>)}
          </select>
          <div style={{marginLeft:'auto'}}>
            <button className="btn btn-green" onClick={()=>setPage('nova')}>✨ Nova Proposta</button>
          </div>
        </div>
        {filtered.length===0?(
          <div className="empty-state">
            <div className="icon">📋</div>
            <h3>Nenhuma proposta encontrada</h3>
            <p>Crie sua primeira proposta ou ajuste os filtros</p>
            <button className="btn btn-primary" style={{marginTop:14}} onClick={()=>setPage('nova')}>Nova Proposta</button>
          </div>
        ):(
          <div className="table-wrap">
            <table>
              <thead><tr><th>Nº</th><th>Nome</th><th>Cliente</th><th>Serviços</th><th>Data</th><th>Valor</th><th>Status</th><th>Ações</th></tr></thead>
              <tbody>
                {filtered.map(p=>{
                  const sm=statusMap[p.status]||statusMap.elaborando;
                  const rem=isReminder(p);
                  return(
                    <tr key={p.id}>
                      <td><strong style={{color:'var(--vd)'}}>{p.number}</strong></td>
                      <td style={{maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{p.proposalName||'—'}</td>
                      <td>{p.client||'—'}</td>
                      <td style={{maxWidth:180}}>
                        {(p.selectedServices||[]).slice(0,2).map(sid=>{
                          const svc=services.find(s=>s.id===sid);
                          return <span key={sid} style={{display:'inline-block',background:'#f0f7e6',color:'#285d02',fontSize:10.5,padding:'2px 6px',borderRadius:10,marginRight:3,marginBottom:2}}>{(p.serviceTitles?.[sid]||svc?.name||sid).split(' ')[0]}</span>;
                        })}
                        {(p.selectedServices||[]).length>2&&<span style={{fontSize:10.5,color:'var(--txl)'}}>+{p.selectedServices.length-2}</span>}
                      </td>
                      <td style={{whiteSpace:'nowrap'}}>{fmtDate(p.date)}</td>
                      <td><strong>{fmtBRL(p.budget?.total||0)}</strong></td>
                      <td>
                        <div style={{display:'flex',flexDirection:'column',gap:3}}>
                          <span className={`badge ${sm.cls}`}>{sm.emoji} {sm.label}</span>
                          {rem&&<span className="reminder-badge">⏰ Lembrete</span>}
                        </div>
                      </td>
                      <td>
                        <div className="actions">
                          <select className="form-control" style={{width:130,padding:'3px 7px',fontSize:12}} value={p.status} onChange={e=>changeStatus(p.id,e.target.value)}>
                            {Object.entries(statusMap).map(([k,v])=><option key={k} value={k}>{v.label}</option>)}
                          </select>
                          <button className="btn-icon" title="Visualizar" onClick={()=>setViewProp(p)}>👁</button>
                          <button className="btn-icon" title="Duplicar" onClick={()=>dup(p)}>📋</button>
                          <button className="btn-icon" title="Gerar Word" onClick={()=>generateWord(p,services,configs)}>📄</button>
                          <button className="btn-icon" title="Excluir" onClick={()=>del(p.id)} style={{color:'#b91c1c'}}>🗑</button>
                        </div>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
      {viewProp&&<ViewModal prop={viewProp} services={services} configs={configs} onClose={()=>setViewProp(null)} onGenWord={()=>generateWord(viewProp,services,configs)}/>}
    </div>
  );
}

// ─── NOVA PROPOSTA ───────────────────────────────────────────────
function NovaPropostaPage({proposals,setProposals,services,cnaes,configs,fixedCosts,onBack}){
  const blank={
    id:Date.now(),number:'',date:today(),
    proposalName:'',client:'',clientCnpj:'',clientContact:'',clientEmail:'',clientAddress:'',
    status:'elaborando',sentAt:null,approvedAt:null,
    selectedServices:[],serviceScopes:{},serviceTitles:{},
    hasOtherService:false,otherServiceTitle:'',otherServiceScope:'',
    objective:'',notIncluded:configs.notIncluded||DEFAULT_NOT_INCLUDED,
    respContratada:configs.respContratada||DEFAULT_RESP_CONTRATADA,
    respContratante:configs.respContratante||DEFAULT_RESP_CONTRATANTE,
    prazoVisita:'',prazoEntrega:'',duracaoCampo:'',
    paymentText:configs.costText||DEFAULT_COST_TEXT,
    paymentMethods:['pix'],
    validity:configs.validity||20,
    parcels:[],
    discount:0,
    budget:{hh:0,fixedCosts:0,projectCosts:0,thirds:0,profit:10,cnaeId:'1',total:0,tax:0,profitVal:0,incluirCF:false},
    budgetDetail:{horas:{visitaTecnica:0,tratamentoDados:0,montagemProcesso:0,confRelatorio:0,revisaoRelatorio:0,elaboracaoDesenhos:0,outrosCustos:0,horasAdm:0},valorHora:35,projectItems:[],thirdItems:[]},
    notes:'',
  };

  const[form,setForm]=useState(()=>{
    // generate number with today
    const n=genProposalNumber(proposals,today());
    return {...blank,number:n};
  });
  const[tab,setTab]=useState('cliente');
  const[saved,setSaved]=useState(false);

  // regenerate number when date changes
  const updDate=val=>{
    const newNum=genProposalNumber(proposals,val);
    setForm(f=>({...f,date:val,number:newNum}));
    setSaved(false);
  };

  const upd=(path,val)=>{
    setForm(f=>{
      const nf=JSON.parse(JSON.stringify(f));
      const keys=path.split('.');let cur=nf;
      for(let i=0;i<keys.length-1;i++) cur=cur[keys[i]];
      cur[keys[keys.length-1]]=val;
      return nf;
    });
    setSaved(false);
  };

  const toggleService=id=>{
    setForm(f=>{
      const sel=f.selectedServices.includes(id)?f.selectedServices.filter(s=>s!==id):[...f.selectedServices,id];
      const svc=services.find(s=>s.id===id);
      const scopes={...f.serviceScopes};const titles={...f.serviceTitles};
      if(!f.selectedServices.includes(id)&&svc){scopes[id]=svc.scope;titles[id]=svc.name;}
      return {...f,selectedServices:sel,serviceScopes:scopes,serviceTitles:titles};
    });setSaved(false);
  };

  // Custos fixos mensais
  const cfMensal=fixedCosts.reduce((s,c)=>s+(c.tipo==='anual'?c.valor/12:c.valor),0);

  const calcBudget=f=>{
    const d=f.budgetDetail;
    const horaTotal=Object.values(d.horas||{}).reduce((s,v)=>s+(+v||0),0);
    const hh=horaTotal*(+d.valorHora||35);
    const proj=(d.projectItems||[]).reduce((s,i)=>s+(+i.qty||1)*(+i.unit||0),0);
    const th=(d.thirdItems||[]).reduce((s,i)=>s+(+i.qty||1)*(+i.unit||0),0);
    const cfAloc=f.budget.incluirCF?cfMensal*(horaTotal/160):0;
    const cnae=cnaes.find(c=>c.id===f.budget.cnaeId)||cnaes[0];
    const taxRate=cnae?.tax||0;
    const profRate=(+f.budget.profit||0)/100;
    const base=hh+cfAloc+proj+th;
    const total=base/(1-taxRate-profRate)||base;
    const tax=total*taxRate;
    const profVal=total*profRate;
    const discountAmt=total*((+f.discount||0)/100);
    return {hh,proj,th,base,total,tax,profVal,taxRate,profRate,cfAloc,horaTotal,discountAmt,totalComDesconto:total-discountAmt};
  };

  const bc=calcBudget(form);

  const save=()=>{
    const bc2=calcBudget(form);
    const fp={...form,budget:{...form.budget,total:bc2.total,tax:bc2.tax,profitVal:bc2.profVal,totalComDesconto:bc2.totalComDesconto}};
    setProposals(ps=>{const ex=ps.findIndex(p=>p.id===fp.id);if(ex>=0){const n=[...ps];n[ex]=fp;return n;}return[fp,...ps];});
    setSaved(true);setTimeout(()=>setSaved(false),2200);
  };

  const tabs=[
    {id:'cliente',label:'1. Cliente'},
    {id:'servicos',label:'2. Serviços'},
    {id:'escopo',label:'3. Escopo'},
    {id:'orcamento',label:'4. Orçamento'},
    {id:'pagamento',label:'5. Pagamento'},
    {id:'revisao',label:'6. Revisão'},
  ];

  return(
    <div>
      <div className="section-header">
        <div><h2 style={{fontSize:22,color:'var(--vd)'}}>Nova Proposta</h2><p style={{color:'var(--txl)',fontSize:13}}>Nº {form.number} · {fmtDate(form.date)}</p></div>
        <div style={{display:'flex',gap:8}}>
          {saved&&<span className="badge" style={{background:'#dcfce7',color:'#166534',fontSize:13}}>✅ Salvo!</span>}
          <button className="btn btn-secondary" onClick={onBack}>← Voltar</button>
          <button className="btn btn-primary" onClick={save}>💾 Salvar</button>
        </div>
      </div>
      <div className="tabs">{tabs.map(t=><button key={t.id} className={`tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>)}</div>
      {tab==='cliente'&&<TabCliente form={form} upd={upd} updDate={updDate}/>}
      {tab==='servicos'&&<TabServicos form={form} services={services} toggleService={toggleService} upd={upd}/>}
      {tab==='escopo'&&<TabEscopo form={form} services={services} upd={upd} configs={configs}/>}
      {tab==='orcamento'&&<TabOrcamento form={form} upd={upd} bc={bc} cnaes={cnaes} fixedCosts={fixedCosts} cfMensal={cfMensal}/>}
      {tab==='pagamento'&&<TabPagamento form={form} upd={upd} bc={bc}/>}
      {tab==='revisao'&&<TabRevisao form={form} services={services} bc={bc} onSave={save} onGenerate={()=>{save();generateWord(form,services,configs);}}/>}
    </div>
  );
}

// TAB 1: CLIENTE
function TabCliente({form,upd,updDate}){
  return(
    <div>
      <div className="card mb-16">
        <div className="card-title">Identificação da Proposta</div>
        <div className="form-row cols-2">
          <div className="form-group">
            <label className="form-label">Data da Proposta <span>*</span></label>
            <input type="date" className="form-control" value={form.date} onChange={e=>updDate(e.target.value)}/>
            <div style={{fontSize:11.5,color:'var(--txl)',marginTop:4}}>O número da proposta é gerado automaticamente com base na data</div>
          </div>
          <div className="form-group">
            <label className="form-label">Número da Proposta</label>
            <input className="form-control" value={form.number} onChange={e=>upd('number',e.target.value)} style={{fontWeight:600,color:'var(--vd)'}}/>

// TAB 5: PAGAMENTO
function TabPagamento({form,upd,bc}){
  const total=form.discount>0?bc.totalComDesconto:bc.total;

  const addParcel=()=>upd('parcels',[...form.parcels,{id:Date.now(),label:'',pct:0,value:0,quando:''}]);
  const remParcel=id=>upd('parcels',form.parcels.filter(p=>p.id!==id));
  const updParcel=(id,k,v)=>{
    const ps=form.parcels.map(p=>{
      if(p.id!==id)return p;
      const u={...p,[k]:v};
      if(k==='pct') u.value=(total*(+v/100)).toFixed(2);
      if(k==='value') u.pct=total>0?((+v/total)*100).toFixed(1):0;
      return u;
    });
    upd('parcels',ps);
  };

  const totalPct=form.parcels.reduce((s,p)=>s+(+p.pct||0),0);
  const methods=[{id:'pix',label:'Pix'},{id:'boleto',label:'Boleto Bancário'},{id:'deposito',label:'Depósito Bancário'},{id:'transferencia',label:'Transferência Bancária'}];
  const toggleMethod=m=>{const cur=form.paymentMethods||[];upd('paymentMethods',cur.includes(m)?cur.filter(x=>x!==m):[...cur,m]);};

  return(
    <div>
      <div className="card mb-16">
        <div className="card-title">Texto sobre o que está incluso no valor</div>
        <textarea className="form-control" rows={4} value={form.paymentText} onChange={e=>upd('paymentText',e.target.value)}/>
      </div>
      <div className="card mb-16">
        <div className="flex-between mb-16">
          <div>
            <div className="card-title" style={{marginBottom:0}}>Parcelamento</div>
            <div style={{fontSize:12.5,color:'var(--txl)',marginTop:3}}>Valor base: <strong>{fmtBRL(total)}</strong>{form.discount>0&&<span style={{color:'var(--vd)'}}> (com {form.discount}% desconto)</span>}</div>
          </div>
          <button className="btn btn-secondary btn-sm" onClick={addParcel}>+ Parcela</button>
        </div>
        {form.parcels.length===0&&<div className="alert alert-info">Adicione parcelas para configurar as condições de pagamento.</div>}
        {form.parcels.map((p,i)=>(
          <div key={p.id} style={{display:'grid',gridTemplateColumns:'160px 130px 140px 1fr auto',gap:8,marginBottom:10,alignItems:'center'}}>
            {/* Nº da parcela — lista suspensa */}
            <div>
              <select className="form-control" value={p.labelOpt||''} onChange={e=>{const v=e.target.value;updParcel(p.id,'labelOpt',v);if(v!=='Outro') updParcel(p.id,'label',v);}} style={{fontSize:13,fontWeight:600,marginBottom:(p.labelOpt==='Outro')?5:0}}>
                <option value="">Selecione...</option>
                <option value="À vista">À vista</option>
                {Array.from({length:24},(_,k)=>(<option key={k+1} value={`${k+1}ª Parcela`}>{k+1}ª Parcela</option>))}
                <option value="Outro">Outro...</option>
              </select>
              {p.labelOpt==='Outro'&&<input className="form-control" value={p.label||''} onChange={e=>updParcel(p.id,'label',e.target.value)} placeholder="Descreva a condição..." style={{fontSize:13,marginTop:4}}/>}
            </div>
            {/* % — campo largo e legível */}
            <div style={{display:'flex',alignItems:'center',gap:0}}>
              <span style={{background:'var(--bg)',border:'1px solid var(--bd)',borderRight:'none',borderRadius:'var(--rs) 0 0 var(--rs)',padding:'9px 10px',fontSize:14,color:'var(--txl)',fontWeight:600}}>%</span>
              <input type="number" className="form-control" value={p.pct} onChange={e=>updParcel(p.id,'pct',e.target.value)} min={0} max={100} step={0.1}
                style={{fontSize:15,fontWeight:700,borderRadius:'0 var(--rs) var(--rs) 0',textAlign:'center',width:'100%',paddingLeft:6,paddingRight:6}}/>
            </div>
            {/* Valor calculado */}
            <div style={{fontSize:14,fontWeight:700,color:'var(--vd)',textAlign:'center',background:'#f0f7e6',padding:'9px 8px',borderRadius:'var(--rs)',border:'1px solid #d0e8b0'}}>{fmtBRL(+p.value)}</div>
            {/* Quando */}
            <select className="form-control" value={p.quando||''} onChange={e=>updParcel(p.id,'quando',e.target.value)} style={{fontSize:12.5}}>
              <option value="">Quando? (opcional)</option>
              {PARCELA_QUANDO_OPTS.map(o=><option key={o} value={o}>{o}</option>)}
            </select>
            <button className="btn-icon" onClick={()=>remParcel(p.id)}>🗑</button>
          </div>
        ))}
        {form.parcels.length>0&&(
          <div style={{display:'flex',justifyContent:'space-between',borderTop:'1px solid var(--bd)',paddingTop:9,marginTop:6}}>
            <span style={{fontWeight:600,fontSize:13}}>Total: {totalPct.toFixed(1)}%</span>
            <span style={{fontWeight:700,color:'var(--vd)'}}>{fmtBRL(form.parcels.reduce((s,p)=>s+(+p.value||0),0))}</span>
          </div>
        )}
        {Math.abs(totalPct-100)>0.5&&form.parcels.length>0&&<div className="alert alert-warning mt-12">As parcelas somam {totalPct.toFixed(1)}% — ajuste para totalizar 100%.</div>}
      </div>
      <div className="card">
        <div className="card-title">Formas de Pagamento Aceitas</div>
        <div style={{display:'flex',flexWrap:'wrap',gap:9}}>
          {methods.map(m=>(
            <label key={m.id} style={{display:'flex',alignItems:'center',gap:8,cursor:'pointer',padding:'8px 13px',border:'1.5px solid',borderRadius:'var(--rs)',fontSize:13.5,borderColor:(form.paymentMethods||[]).includes(m.id)?'var(--vl)':'var(--bd)',background:(form.paymentMethods||[]).includes(m.id)?'rgba(154,191,74,.08)':'#fff'}}>
              <input type="checkbox" checked={(form.paymentMethods||[]).includes(m.id)} onChange={()=>toggleMethod(m.id)}/>{m.label}
            </label>
          ))}
        </div>
      </div>
    </div>
  );
}

// TAB 6: REVISÃO
function TabRevisao({form,services,bc,onSave,onGenerate}){
  const[generating,setGenerating]=useState(false);
  const missings=[];
  if(!form.client) missings.push('Nome do cliente');
  if(!form.proposalName) missings.push('Nome da proposta');
  if(form.selectedServices.length===0&&!form.hasOtherService) missings.push('Serviços selecionados');
  if(bc.total<=0) missings.push('Valor do orçamento');

  const handleGenerate=async()=>{
    setGenerating(true);
    try{await onGenerate();}catch(e){}finally{setGenerating(false);}
  };

  const total=form.discount>0?bc.totalComDesconto:bc.total;
  const horaTotal=Object.values(form.budgetDetail?.horas||{}).reduce((s,v)=>s+(+v||0),0);

  return(
    <div>
      {missings.length>0&&<div className="alert alert-warning"><strong>Campos pendentes:</strong> {missings.join(', ')}</div>}
      {missings.length===0&&<div className="alert alert-success">✅ Proposta completa e pronta para gerar!</div>}
      <div className="card mb-16">
        <div className="card-title">Resumo da Proposta</div>
        <table style={{width:'100%',fontSize:13.5}}>
          <tbody>
            {[['Nº',form.number],['Nome',form.proposalName],['Cliente',form.client||'—'],['Data',fmtDate(form.date)],['Validade',`${form.validity} dias`]].map(([l,v])=>(
              <tr key={l} style={{borderBottom:'1px solid var(--bd)'}}><td style={{padding:'8px 0',color:'var(--txl)',width:150}}>{l}</td><td style={{padding:'8px 0',fontWeight:500}}>{v}</td></tr>
            ))}
            <tr style={{borderBottom:'1px solid var(--bd)'}}><td style={{padding:'8px 0',color:'var(--txl)'}}>Serviços</td><td style={{padding:'8px 0'}}>{form.selectedServices.map(id=>services.find(s=>s.id===id)?.name).join(', ')||(form.hasOtherService?form.otherServiceTitle:'')||'—'}</td></tr>
            <tr style={{borderBottom:'1px solid var(--bd)'}}><td style={{padding:'8px 0',color:'var(--txl)'}}>Valor Total</td><td style={{padding:'8px 0',fontWeight:700,fontSize:16,color:'var(--vd)'}}>{fmtBRL(bc.total)}{form.discount>0&&<span style={{fontSize:13,color:'#b91c1c',marginLeft:8}}>→ com desconto: {fmtBRL(total)}</span>}</td></tr>
            <tr style={{borderBottom:'1px solid var(--bd)'}}><td style={{padding:'8px 0',color:'var(--txl)'}}>Impostos</td><td style={{padding:'8px 0'}}>{fmtBRL(bc.tax)} ({(bc.taxRate*100).toFixed(1)}%)</td></tr>
            <tr style={{borderBottom:'1px solid var(--bd)'}}><td style={{padding:'8px 0',color:'var(--txl)'}}>Lucro da empresa</td><td style={{padding:'8px 0',color:'var(--vd)',fontWeight:600}}>{fmtBRL(bc.profVal)} ({form.budget.profit}%)</td></tr>
            <tr><td style={{padding:'8px 0',color:'var(--txl)'}}>Minha remuneração (HH)</td><td style={{padding:'8px 0',fontWeight:700,color:'var(--az)',fontSize:15}}>{horaTotal}h × {fmtBRL(+form.budgetDetail?.valorHora||35)}/h = <strong>{fmtBRL(bc.hh)}</strong></td></tr>
          </tbody>
        </table>
      </div>
      {form.parcels.length>0&&(
        <div className="card mb-16">
          <div className="card-title">Condições de Pagamento</div>
          {form.parcels.map((p,i)=>(
            <div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'8px 0',borderBottom:'1px solid var(--bd)'}}>
              <span>{p.label||`Parcela ${i+1}`}</span>
              <div style={{textAlign:'right'}}><span style={{fontWeight:600}}>{fmtBRL(+p.value)}</span>{p.quando&&<span style={{fontSize:12,color:'var(--txl)',marginLeft:8}}>— {p.quando}</span>}</div>
            </div>
          ))}
        </div>
      )}
      <div style={{display:'flex',gap:12,justifyContent:'flex-end'}}>
        <button className="btn btn-secondary" onClick={onSave}>💾 Salvar Rascunho</button>
        <button className="btn btn-primary" onClick={handleGenerate} disabled={missings.length>0||generating}>{generating?'⏳ Gerando...':'📄 Salvar e Gerar Word'}</button>
      </div>
    </div>
  );
}

// ─── VIEW MODAL ──────────────────────────────────────────────────
function ViewModal({prop,services,configs,onClose,onGenWord}){
  return(
    <div className="modal-overlay" onClick={e=>{if(e.target.className==='modal-overlay')onClose();}}>
      <div className="modal">
        <div className="modal-header"><h3>📋 {prop.number} — {prop.proposalName||prop.client}</h3><button className="btn-icon" onClick={onClose}>✕</button></div>
        <div className="modal-body">
          <div className="form-row cols-2" style={{marginBottom:12}}>
            <div><strong>Cliente:</strong> {prop.client}</div>
            <div><strong>Data:</strong> {fmtDate(prop.date)}</div>
          </div>
          <div className="divider"/>
          <div><strong>Serviços:</strong></div>
          <div style={{marginTop:8}}>{(prop.selectedServices||[]).map(id=>{const s=services.find(x=>x.id===id);return <span key={id} className="badge" style={{background:'#f0f7e6',color:'var(--vd)',marginRight:6,marginBottom:6}}>{prop.serviceTitles?.[id]||s?.name||id}</span>})}</div>
          {prop.hasOtherService&&prop.otherServiceTitle&&<span className="badge" style={{background:'#f0f7e6',color:'var(--vd)'}}>{prop.otherServiceTitle}</span>}
          <div className="divider"/>
          <div className="form-row cols-2">
            <div><strong>Valor:</strong> <span style={{fontSize:17,color:'var(--vd)',fontWeight:700}}>{fmtBRL(prop.budget?.total||0)}</span>{prop.discount>0&&<span style={{fontSize:13,color:'#b91c1c',marginLeft:8}}>→ desconto {prop.discount}%: {fmtBRL(prop.budget?.totalComDesconto||0)}</span>}</div>
            <div><strong>Validade:</strong> {prop.validity||20} dias</div>
          </div>
          {prop.prazoVisita&&<div style={{marginTop:8}}><strong>Mobilização para campo:</strong> {PRAZO_VISITA_OPTS.find(o=>o.value===prop.prazoVisita)?.label||prop.prazoVisita}</div>}
          {prop.prazoEntrega&&<div><strong>Entrega do laudo:</strong> {prop.prazoEntrega} dias úteis após campo</div>}
          {(prop.parcels||[]).length>0&&<>
            <div className="divider"/>
            <div><strong>Parcelas:</strong></div>
            {prop.parcels.map((p,i)=><div key={p.id} style={{display:'flex',justifyContent:'space-between',padding:'6px 0',borderBottom:'1px solid var(--bd)'}}><span>{p.label||`Parcela ${i+1}`}{p.quando&&<span style={{fontSize:12,color:'var(--txl)'}}> — {p.quando}</span>}</span><strong>{fmtBRL(+p.value)}</strong></div>)}
          </>}
        </div>
        <div className="modal-footer">
          <button className="btn btn-secondary" onClick={onClose}>Fechar</button>
          <button className="btn btn-primary" onClick={onGenWord}>📄 Gerar Word</button>
        </div>
      </div>
    </div>
  );
}

// ─── CONFIG PAGE ─────────────────────────────────────────────────
function ConfigPage({services,setServices,cnaes,setCnaes,configs,setConfigs,fixedCosts,setFixedCosts}){
  const[tab,setTab]=useState('servicos');
  const[editSvc,setEditSvc]=useState(null);
  const[newSvc,setNewSvc]=useState({id:'',name:'',cnae:'1',scope:''});

  const addCnae=()=>setCnaes(cs=>[...cs,{id:Date.now().toString(),code:'',desc:'',tax:0}]);
  const updCnae=(id,k,v)=>setCnaes(cs=>cs.map(c=>c.id===id?{...c,[k]:v}:c));
  const delCnae=id=>{if(confirm('Excluir CNAE?'))setCnaes(cs=>cs.filter(c=>c.id!==id));};

  // Custos Fixos
  const addCF=()=>setFixedCosts(cf=>[...cf,{id:Date.now(),nome:'',valor:0,tipo:'mensal'}]);
  const updCF=(id,k,v)=>setFixedCosts(cf=>cf.map(c=>c.id===id?{...c,[k]:v}:c));
  const delCF=id=>{if(confirm('Excluir?'))setFixedCosts(cf=>cf.filter(c=>c.id!==id));};
  const cfMensal=fixedCosts.reduce((s,c)=>s+(c.tipo==='anual'?c.valor/12:c.valor),0);

  return(
    <div>
      <div className="page-header"><h2>Configurações</h2><p>Personalize serviços, CNAEs, textos padrão e dados da empresa</p></div>
      <div className="tabs" style={{marginBottom:18}}>
        {[{id:'servicos',label:'Serviços'},{id:'cnaes',label:'CNAE / Impostos'},{id:'custosfixos',label:'Custos Fixos'},{id:'textos',label:'Textos Padrão'},{id:'empresa',label:'Empresa'}].map(t=>(
          <button key={t.id} className={`tab${tab===t.id?' active':''}`} onClick={()=>setTab(t.id)}>{t.label}</button>
        ))}
      </div>
      {tab==='servicos'&&(
        <div>
          {editSvc&&(
            <div className="card mb-16" style={{border:'2px solid var(--vl)'}}>
              <div className="card-title">Editando: {editSvc.name}</div>
              <div className="form-group"><label className="form-label">Nome</label><input className="form-control" value={editSvc.name} onChange={e=>setEditSvc(s=>({...s,name:e.target.value}))}/></div>
              <div className="form-group"><label className="form-label">CNAE padrão</label>
                <select className="form-control" value={editSvc.cnae} onChange={e=>setEditSvc(s=>({...s,cnae:e.target.value}))}>
                  {cnaes.map(c=><option key={c.id} value={c.id}>{c.code}</option>)}
                </select>
              </div>
              <div className="form-group"><label className="form-label">Escopo padrão</label><textarea className="form-control" rows={8} value={editSvc.scope} onChange={e=>setEditSvc(s=>({...s,scope:e.target.value}))}/></div>
              <div style={{display:'flex',gap:8}}>
                <button className="btn btn-primary" onClick={()=>{setServices(ss=>ss.map(s=>s.id===editSvc.id?editSvc:s));setEditSvc(null);}}>💾 Salvar</button>
                <button className="btn btn-secondary" onClick={()=>setEditSvc(null)}>Cancelar</button>
              </div>
            </div>
          )}
          <div className="card">
            <div className="flex-between mb-16">
              <div className="card-title" style={{marginBottom:0}}>Serviços cadastrados</div>
              <button className="btn btn-secondary btn-sm" onClick={()=>{const id='svc_'+Date.now();setNewSvc({id,name:'',cnae:'1',scope:''});setEditSvc({id,name:'',cnae:'1',scope:''});setServices(ss=>[...ss,{id,name:'Novo Serviço',cnae:'1',scope:''}]);}}>+ Novo Serviço</button>
            </div>
            {services.map(s=>(
              <div key={s.id} className="config-item">
                <div><div style={{fontWeight:600,fontSize:13.5}}>{s.name}</div><div style={{fontSize:12,color:'var(--txl)'}}>{cnaes.find(c=>c.id===s.cnae)?.code||''}</div></div>
                <div style={{display:'flex',gap:6}}>
                  <button className="btn btn-secondary btn-sm" onClick={()=>setEditSvc({...s})}>✏️ Editar</button>
                  <button className="btn btn-danger btn-sm" onClick={()=>{if(confirm('Excluir serviço?'))setServices(ss=>ss.filter(x=>x.id!==s.id));}}>🗑</button>
                </div>
              </div>
            ))}
          </div>
        </div>
      )}
      {tab==='cnaes'&&(
        <div className="card">
          <div className="flex-between mb-16">
            <div className="card-title" style={{marginBottom:0}}>CNAE e Alíquotas</div>
            <button className="btn btn-secondary btn-sm" onClick={addCnae}>+ Adicionar CNAE</button>
          </div>
          {cnaes.map(c=>(
            <div key={c.id} style={{display:'grid',gridTemplateColumns:'1fr 2fr 100px auto',gap:10,marginBottom:10,alignItems:'center'}}>
              <input className="form-control" value={c.code} onChange={e=>updCnae(c.id,'code',e.target.value)} placeholder="Código CNAE"/>
              <input className="form-control" value={c.desc} onChange={e=>updCnae(c.id,'desc',e.target.value)} placeholder="Descrição"/>
              <div className="input-prefix">
                <span className="prefix">%</span>
                <input type="number" className="form-control" value={(c.tax*100).toFixed(1)} onChange={e=>updCnae(c.id,'tax',+e.target.value/100)} min={0} max={100} step={0.1}/>
              </div>
              <button className="btn-icon" onClick={()=>delCnae(c.id)}>🗑</button>
            </div>
          ))}
        </div>
      )}
      {tab==='custosfixos'&&(
        <div className="card">
          <div className="flex-between mb-16">
            <div>
              <div className="card-title" style={{marginBottom:2}}>Custos Fixos da Empresa</div>
              <div style={{fontSize:13,color:'var(--txl)'}}>Total mensal: <strong style={{color:'var(--vd)'}}>{fmtBRL(cfMensal)}</strong></div>
            </div>
            <button className="btn btn-secondary btn-sm" onClick={addCF}>+ Adicionar</button>
          </div>
          {fixedCosts.map(c=>(
            <div key={c.id} style={{display:'grid',gridTemplateColumns:'2fr 1fr 120px auto',gap:10,marginBottom:8,alignItems:'center'}}>
              <input className="form-control" value={c.nome} onChange={e=>updCF(c.id,'nome',e.target.value)} placeholder="Nome do custo"/>
              <select className="form-control" value={c.tipo} onChange={e=>updCF(c.id,'tipo',e.target.value)}>
                <option value="mensal">Mensal</option>
                <option value="anual">Anual</option>
              </select>
              <div className="input-prefix">
                <span className="prefix">R$</span>
                <input type="number" className="form-control" value={c.valor} onChange={e=>updCF(c.id,'valor',+e.target.value)} min={0} step={0.01}/>
              </div>
              <button className="btn-icon" onClick={()=>delCF(c.id)}>🗑</button>
            </div>
          ))}
          <div style={{borderTop:'1px solid var(--bd)',paddingTop:10,marginTop:6,display:'flex',justifyContent:'space-between',fontWeight:700}}>
            <span>Total mensal consolidado</span>
            <span style={{color:'var(--vd)'}}>{fmtBRL(cfMensal)}</span>
          </div>
        </div>
      )}
      {tab==='textos'&&(
        <div>
          <div className="card mb-16"><div className="card-title">Não incluso no escopo (padrão)</div><textarea className="form-control" rows={7} value={configs.notIncluded||''} onChange={e=>setConfigs(c=>({...c,notIncluded:e.target.value}))}/></div>
          <div className="card mb-16"><div className="card-title">Responsabilidades da Contratada (padrão)</div><textarea className="form-control" rows={5} value={configs.respContratada||''} onChange={e=>setConfigs(c=>({...c,respContratada:e.target.value}))}/></div>
          <div className="card mb-16"><div className="card-title">Responsabilidades da Contratante (padrão)</div><textarea className="form-control" rows={4} value={configs.respContratante||''} onChange={e=>setConfigs(c=>({...c,respContratante:e.target.value}))}/></div>
          <div className="card mb-16"><div className="card-title">Texto sobre o que está incluso no valor (padrão)</div><textarea className="form-control" rows={4} value={configs.costText||''} onChange={e=>setConfigs(c=>({...c,costText:e.target.value}))}/></div>
          <div className="card"><div className="card-title">Validade padrão das propostas (dias)</div><input type="number" className="form-control" style={{maxWidth:120}} value={configs.validity||20} onChange={e=>setConfigs(c=>({...c,validity:+e.target.value}))}/></div>
        </div>
      )}
      {tab==='empresa'&&(
        <div className="card">
          <div className="card-title">Dados da Empresa</div>
          {[['name','Razão Social'],['cnpj','CNPJ'],['responsavel','Responsável Técnica'],['endereco','Endereço'],['contato','Telefone / WhatsApp']].map(([k,l])=>(
            <div key={k} className="form-group"><label className="form-label">{l}</label><input className="form-control" value={configs.empresa?.[k]||''} onChange={e=>setConfigs(c=>({...c,empresa:{...c.empresa,[k]:e.target.value}}))}/></div>
          ))}
        </div>
      )}
    </div>
  );
}

ReactDOM.render(<App/>,document.getElementById('root'));
</script>
</body>
</html>
